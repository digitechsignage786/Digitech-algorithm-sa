name: Build Digitech Algorithm V28 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find exact V28 Fixed3 ZIP
        run: |
          set -e

          ZIP="./DigitechAlgorithm_V28_Fixed3.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: V28 Fixed3 ZIP not found"
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using: $ZIP"

          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Locate Android project
        run: |
          set -e

          SETTINGS=$(find project -type f -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found"
            find project -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      - name: Build V28 APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload V28 APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitechAlgorithm-V28-Fixed3-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
