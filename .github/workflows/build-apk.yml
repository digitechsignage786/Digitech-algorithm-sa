name: Build Digitech Algorithm V28 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build V28 APK
        run: gradle --no-daemon assembleDebug

      - name: Upload V28 APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitechAlgorithm-V28-APK
          path: app/build/outputs/apk/debug/*.apk
