name: Build Digitech Algorithm V19 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find V19 ZIP
        run: |
          set -e
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

          ZIP=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: V19 ZIP not found in repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP"

      - name: Extract V19 project
        run: |
          set -e

          ZIP=$(find . -type f -iname "*.zip" | head -n 1)

          rm -rf /tmp/v19
          mkdir -p /tmp/v19

          unzip -o "$ZIP" -d /tmp/v19

          SETTINGS=$(find /tmp/v19 -type f \( \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found inside ZIP."
            find /tmp/v19 -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project found at: $PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. .

      - name: Verify project
        run: |
          set -e
          echo "Final project:"
          ls -la
          test -d app
          test -f settings.gradle.kts || test -f settings.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitechAlgorithm-v19-APK
          path: app/build/outputs/apk/debug/*.apk
