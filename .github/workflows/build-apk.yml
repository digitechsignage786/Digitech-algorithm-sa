name: Build Digitech Algorithm V28 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract V28 project
        run: |
          set -e
          mkdir -p project
          ZIP=$(find . -maxdepth 2 -type f -name 'DigitechAlgorithm*.zip' | head -n 1)

if [ -z "$ZIP" ]; then
  echo "Digitech Algorithm ZIP not found"
  exit 1
fi

echo "Using ZIP: $ZIP"

mkdir -p project
unzip -q "$ZIP" -d project

      - name: Check Gradle project
        working-directory: project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          echo "V28 Android project found"

      - name: Build V28 APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload V28 APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitechAlgorithm-V28-Fixed-APK
          path: project/app/build/outputs/apk/debug/*.apk
