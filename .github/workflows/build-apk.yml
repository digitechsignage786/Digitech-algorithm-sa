name: Build Digitech Algorithm V28 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find V28 ZIP
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -name 'DigitechAlgorithm_V28_Fixed3.zip' -print -quit)

if [ -z "$ZIP" ]; then
  echo "V28 Fixed3 ZIP not found"
  exit 1
fi

echo "Using exact V28 Fixed3 ZIP: $ZIP"
mkdir -p project
unzip -q "$ZIP" -d project

          if [ -z "$ZIP" ]; then
            echo "Digitech Algorithm ZIP not found"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          mkdir -p project
          unzip -q "$ZIP" -d project

      - name: Locate Android project
        run: |
          set -e

          ROOT=$(find project -type f -name 'settings.gradle.kts' -print -quit)

          if [ -z "$ROOT" ]; then
            echo "settings.gradle.kts not found"
            find project -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$ROOT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Build V28 APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Upload V28 APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitechAlgorithm-V28-Fixed-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
