name: Build Digitech Algorithm V19 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V19 ZIP
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "V19 ZIP not found"
            exit 1
          fi

          mkdir -p /tmp/v19
          unzip -o "$ZIP" -d /tmp/v19

          PROJECT=$(find /tmp/v19 -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "Android project not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          cp -R "$PROJECT_DIR"/. .

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android project
        run: |
          echo "Checking project..."
          ls -la
          test -d app
          test -f settings.gradle.kts || test -f settings.gradle

      - name: Build APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitechAlgorithm-v19-APK
          path: app/build/outputs/apk/debug/*.apk
