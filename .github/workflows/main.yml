name: Build Digitech Algorithm

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Test Branch
        uses: actions/checkout@v4
        with:
          ref: ict-auto-visibility-review-v1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        env:
          MARKET_DATA_WORKER_URL: ${{ secrets.MARKET_DATA_WORKER_URL }}
        run: |
          gradle --no-daemon testDebugUnitTest assembleDebug \
            -PMARKET_DATA_WORKER_URL="$MARKET_DATA_WORKER_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitechAlgorithm-Test-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
