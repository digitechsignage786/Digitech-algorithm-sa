name: Build Digitech Algorithm

on:
  workflow_dispatch:
  push:
    branches:
      - ict-bos-confirmation-index-fix-v1
      - ict-bos-log-test-package-v1
      - smart-ict-complete-integration-v1
      - smart-ict-data-validation-v1
      - anr-ict-render-cache-test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          gradle --no-daemon testDebugUnitTest assembleDebug \
            -PTWELVE_DATA_API_KEY="$TWELVE_DATA_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitechAlgorithm-Test-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
