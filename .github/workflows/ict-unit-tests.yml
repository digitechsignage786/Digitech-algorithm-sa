name: ICT Unit Tests and Test APK

on:
  push:
    branches:
      - ict-auto-visibility-review-v1
  pull_request:
    branches:
      - smart-ict-data-validation-v1

permissions:
  contents: read

jobs:
  ict-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android unit tests
        run: gradle testDebugUnitTest

      - name: Build test APK
        run: gradle assembleDebug
