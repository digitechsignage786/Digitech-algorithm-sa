name: ICT Unit Tests and Test APK

on:
  push:
    branches:
      - ict-auto-visibility-review-v1
  pull_request:
    branches:
      - smart-ict-data-validation-v1

permissions:
  contents: read

jobs:
  ict-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android unit tests
        run: gradle testDebugUnitTest

      - name: Build test APK
        env:
          MARKET_DATA_WORKER_URL: ${{ secrets.MARKET_DATA_WORKER_URL }}
        run: |
          gradle --no-daemon assembleDebug \
            -PMARKET_DATA_WORKER_URL="$MARKET_DATA_WORKER_URL"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: digitech-ict-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
